<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800" height="220">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#06b6d4"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 1 0; -1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <style>
      .title { font: 800 58px 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: -1px; }
      .sub { font: 500 20px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8b949e; letter-spacing: 4px; }
      .float { animation: float 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .f2 { animation-delay: -1.3s; }
      .f3 { animation-delay: -2.6s; }
      .spin { animation: spin 10s linear infinite; transform-box: fill-box; transform-origin: center; }
      .fade { animation: fade 1.2s ease-out both; }
      .fade2 { animation-delay: .5s; }
      @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-12px) } }
      @keyframes spin { to { transform: rotate(360deg) } }
      @keyframes fade { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: translateY(0) } }
    </style>
  </defs>

  <!-- formes décoratives -->
  <g opacity="0.8">
    <rect class="float spin" x="20" y="40" width="34" height="34" rx="6" fill="none" stroke="url(#grad2)" stroke-width="4"/>
    <circle class="float f2" cx="770" cy="50" r="16" fill="none" stroke="#06b6d4" stroke-width="4"/>
    <polygon class="float f3" points="700,170 722,150 744,170" fill="none" stroke="#ec4899" stroke-width="4" stroke-linejoin="round"/>
    <circle class="float f3" cx="100" cy="165" r="7" fill="#6366f1"/>
  </g>

  <text class="title" x="400" y="115" text-anchor="middle" fill="url(#grad)">Technord Team Lyon</text>
  <text class="sub" x="400" y="160" text-anchor="middle">ACCELERATOR · WEB · TOOLS</text>
</svg>
