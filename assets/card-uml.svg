<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 140" width="380" height="140">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <style>
      .t { font: 700 22px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }
      .d { font: 400 14px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8b949e; }
      .b { font: 600 13px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #fff; }
      .ic { animation: bob 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-5px) } }
    </style>
  </defs>
  <rect x="1" y="1" width="378" height="138" rx="16" fill="#161b22" stroke="url(#g)" stroke-width="2"/>
  <g class="ic">
    <rect x="22" y="30" width="80" height="80" rx="18" fill="url(#g)"/>
    <!-- icône diagramme UML -->
    <rect x="34" y="42" width="24" height="18" rx="3" fill="none" stroke="#fff" stroke-width="3"/>
    <rect x="66" y="80" width="24" height="18" rx="3" fill="none" stroke="#fff" stroke-width="3"/>
    <rect x="34" y="80" width="24" height="18" rx="3" fill="none" stroke="#fff" stroke-width="3"/>
    <path d="M46 60 V80 M58 51 H78 V80" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text class="t" x="124" y="58">WEB UML Editor</text>
  <text class="d" x="124" y="82">Diagrammes UML dans le navigateur</text>
  <rect x="124" y="96" width="96" height="26" rx="13" fill="url(#g)"/>
  <text class="b" x="172" y="114" text-anchor="middle">▶  Ouvrir</text>
</svg>
